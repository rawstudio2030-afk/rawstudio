# Los avisos que no pueden esperar a que alguien abra el panel.
#
# Son tres y van en el MISMO trabajo a proposito: tres tareas programadas
# separadas invitaban a que una se desactivara sin que nadie lo notara, y la
# que se queda callada siempre acaba siendo la que mira hacia fuera.
#
# EL CAMINO PRINCIPAL YA NO ES ESTE. Desde el 5 de noviembre de 2026 los tres
# avisos salen en segundos, por disparadores de la propia base de datos sobre
# pg_net (ver 20261109000000_avisar_al_instante.sql y
# 20261110000000_aviso_verificacion.sql). Esto se queda como RED DE SEGURIDAD:
# si la boveda se queda sin el secreto o pg_net falla, el aviso sale con
# retraso en vez de no salir. Los dos caminos no se duplican porque
# `avisado_at` y `avisada_estado` impiden el segundo envio.

name: Avisos automáticos

on:
  schedule:
    # Cada dos horas. El minuto 7 y no el 0 a proposito: a las horas en punto
    # se amontonan las tareas de todo GitHub y los retrasos son peores.
    - cron: '7 */2 * * *'
  # Para probarlo sin esperar: pestaña Actions -> Avisos automáticos -> Run
  # workflow. Es seguro: si no hay nada nuevo, ningun paso manda correo.
  workflow_dispatch:

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Avisar de retiros pedidos
        env:
          # El mismo secreto que usa el aviso de purga. No es la llave de
          # servicio: es una cadena al azar que solo sirve para decir «manda
          # el aviso». La llave que puede todo se queda en Supabase.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secreto CRON_SECRET en el repositorio."
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi

          # La URL del proyecto es publica: viaja dentro del bundle del sitio.
          respuesta=$(curl --silent --show-error --fail-with-body \
            --max-time 120 \
            --header "x-cron-secret: $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --request POST \
            "https://ggyubhyobobizugeknen.supabase.co/functions/v1/avisar-retiro")

          echo "$respuesta"

          # Un fallo de envio no debe pasar desapercibido: si Resend rechaza,
          # el trabajo se pone en rojo y GitHub avisa. Importa mas aqui que en
          # la purga: al otro lado hay alguien esperando que le paguen.
          echo "$respuesta" | grep -q '"ok":true' || {
            echo "El aviso no se pudo mandar."
            exit 1
          }

      # El otro lado de la misma conversacion, y en el mismo trabajo a
      # proposito: aprobar un retiro y contarselo a quien lo pidio son dos
      # mitades de un mismo acto, y separarlas en dos tareas programadas
      # invitaba a que una se desactivara sin que nadie lo notara.
      #
      # `if: always()` para que un fallo avisando a administracion no deje a
      # la creadora sin su correo. El trabajo queda en rojo si falla
      # cualquiera de los dos.
      - name: Avisar a la creadora
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secreto CRON_SECRET en el repositorio."
            exit 1
          fi

          respuesta=$(curl --silent --show-error --fail-with-body \
            --max-time 120 \
            --header "x-cron-secret: $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --request POST \
            "https://ggyubhyobobizugeknen.supabase.co/functions/v1/avisar-creadora")

          echo "$respuesta"

          echo "$respuesta" | grep -q '"ok":true' || {
            echo "No pude avisar a la creadora."
            exit 1
          }

      # Tercer aviso, y el unico que no va de dinero: alguien mando su INE y
      # su selfie y espera a que una persona lo mire. Hasta que se resuelva
      # NO PUEDE SUBIR NADA, porque publicar exige la identidad verificada.
      #
      # `if: always()` por la misma razon que arriba: un fallo en los avisos
      # de retiro no puede dejar una verificacion sin avisar.
      - name: Avisar de identidades por revisar
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secreto CRON_SECRET en el repositorio."
            exit 1
          fi

          respuesta=$(curl --silent --show-error --fail-with-body \
            --max-time 120 \
            --header "x-cron-secret: $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --request POST \
            "https://ggyubhyobobizugeknen.supabase.co/functions/v1/avisar-verificacion")

          echo "$respuesta"

          echo "$respuesta" | grep -q '"ok":true' || {
            echo "No pude avisar de las verificaciones."
            exit 1
          }
