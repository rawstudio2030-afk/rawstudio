# Los dos avisos de un retiro: el que va a administracion y el que va a ella.
#
# Las dos mitades de la misma conversacion viven en el mismo trabajo. Aprobar
# un retiro y contarselo a quien lo pidio no son dos tareas, son una; dos
# tareas programadas separadas invitaban a que una se desactivara sin que
# nadie lo notara, y la que se queda callada siempre es la que mira hacia
# fuera.
#
# Hermana de aviso-purga.yml, con otro ritmo. La purga va semanal porque el
# plazo es de treinta dias y no corre prisa. Un retiro es una persona
# esperando dinero suyo, asi que esto corre cada dos horas.
#
# De cada solicitud se avisa UNA vez: la funcion marca `avisado_at` cuando
# Resend acepta el correo. Asi doce ejecuciones al dia no son doce correos.
#
# AVISO SOBRE LA FIABILIDAD DE ESTO: las tareas programadas de GitHub Actions
# se retrasan cuando hay carga, y se desactivan solas si el repositorio pasa
# 60 dias sin actividad. Para avisos de dinero eso es mejorable: la version
# buena es un disparador en la propia base de datos (pg_net sobre el insert
# en `solicitudes_retiro`), que avisa en segundos y no depende de GitHub. Se
# hizo asi primero porque reusa entero lo que ya funciona y no necesita
# configurar nada mas. El contador del panel sigue siendo la red de seguridad.

name: Avisos de retiro

on:
  schedule:
    # Cada dos horas. El minuto 7 y no el 0 a proposito: a las horas en punto
    # se amontonan las tareas de todo GitHub y los retrasos son peores.
    - cron: '7 */2 * * *'
  # Para probarlo sin esperar: pestaña Actions -> Avisos de retiro -> Run
  # workflow. Es seguro: si no hay nada nuevo, ninguno de los dos pasos manda
  # correo.
  workflow_dispatch:

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir el aviso
        env:
          # El mismo secreto que usa el aviso de purga. No es la llave de
          # servicio: es una cadena al azar que solo sirve para decir «manda
          # el aviso». La llave que puede todo se queda en Supabase.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secreto CRON_SECRET en el repositorio."
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi

          # La URL del proyecto es publica: viaja dentro del bundle del sitio.
          respuesta=$(curl --silent --show-error --fail-with-body \
            --max-time 120 \
            --header "x-cron-secret: $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --request POST \
            "https://ggyubhyobobizugeknen.supabase.co/functions/v1/avisar-retiro")

          echo "$respuesta"

          # Un fallo de envio no debe pasar desapercibido: si Resend rechaza,
          # el trabajo se pone en rojo y GitHub avisa. Importa mas aqui que en
          # la purga: al otro lado hay alguien esperando que le paguen.
          echo "$respuesta" | grep -q '"ok":true' || {
            echo "El aviso no se pudo mandar."
            exit 1
          }

      # El otro lado de la misma conversacion, y en el mismo trabajo a
      # proposito: aprobar un retiro y contarselo a quien lo pidio son dos
      # mitades de un mismo acto, y separarlas en dos tareas programadas
      # invitaba a que una se desactivara sin que nadie lo notara.
      #
      # `if: always()` para que un fallo avisando a administracion no deje a
      # la creadora sin su correo. El trabajo queda en rojo si falla
      # cualquiera de los dos.
      - name: Avisar a la creadora
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secreto CRON_SECRET en el repositorio."
            exit 1
          fi

          respuesta=$(curl --silent --show-error --fail-with-body \
            --max-time 120 \
            --header "x-cron-secret: $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --request POST \
            "https://ggyubhyobobizugeknen.supabase.co/functions/v1/avisar-creadora")

          echo "$respuesta"

          echo "$respuesta" | grep -q '"ok":true' || {
            echo "No pude avisar a la creadora."
            exit 1
          }
